<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FluidBuddha logo</title>
<link rel="icon" href="favicon.svg">
<style>
  body{margin:0;font-family:system-ui,sans-serif;color:#5c554b}
  .band{display:flex;gap:56px;align-items:center;flex-wrap:wrap;padding:48px 56px}
  .paper{background:#f6f2ea}.ink{background:#0a0908;color:#7c746b}.white{background:#fff}
  figure{margin:0} figcaption{font:11px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;margin-top:12px}
  .stack{height:190px}.hor{height:64px}.nav{height:30px}
  .compare{display:flex;gap:56px;align-items:center}
</style></head><body>
<div class="band paper">
  <div class="compare">
    <figure><img class="stack" src="logo-fluidbuddha-gold.svg"><figcaption>FluidBuddha · gold</figcaption></figure>
    <figure><img class="stack" src="../reference/logo-hire-buddha-gold.svg"><figcaption>Hire Buddha · reference</figcaption></figure>
  </div>
</div>
<div class="band ink">
  <figure><img class="stack" src="logo-fluidbuddha-onblack.svg"><figcaption>On black</figcaption></figure>
  <figure><img class="stack" src="logo-fluidbuddha-white.svg"><figcaption>White</figcaption></figure>
  <figure><img class="stack" src="logo-fluidbuddha-gold.svg"><figcaption>Gold on ink</figcaption></figure>
</div>
<div class="band white">
  <figure><img class="stack" src="logo-fluidbuddha-black.svg"><figcaption>Black</figcaption></figure>
  <figure><img class="hor" src="logo-fluidbuddha-horizontal-gold.svg"><figcaption>Horizontal · gold</figcaption></figure>
</div>
<div class="band ink">
  <figure><img class="hor" src="logo-fluidbuddha-horizontal-onblack.svg"><figcaption>Horizontal · on black</figcaption></figure>
  <figure><img class="nav" src="logo-fluidbuddha-horizontal-white.svg"><figcaption>Nav size · 30px</figcaption></figure>
  <figure><img style="height:48px" src="favicon.svg"><figcaption>Icon / favicon</figcaption></figure>
</div>
</body></html>
