# FluidBuddha production on one Azure VM (docs/deployment/azure-production-plan.md §2).
#
# vm/fluidbuddha-deploy starts this with the files it renders from Key Vault:
#   /opt/fluidbuddha/.env            compose variables (release, registry, domains, Postgres password)
#   /opt/fluidbuddha/backend.env     the backend's settings: prod.env plus secrets
#   /opt/fluidbuddha/turnserver.conf the TURN relay's settings
#   /opt/fluidbuddha/secrets/        the Vertex AI service-account key
# On the VM, `fluidbuddha compose <args>` runs docker compose with all of that in place.
#
# Images come from the registry, tagged with the release's git SHA. Only the edge (80, 443) and the
# TURN relay are reachable from outside; everything else talks on the private compose network.
name: fluidbuddha

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # Caddy: TLS for all four names, routing, and the widget's files under gateway/sdk/.
  edge:
    image: ${REGISTRY:?}/fluidbuddha/edge:${FB_VERSION:?}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      console:
        condition: service_healthy
      website:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FB_HOME:-/opt/fluidbuddha}/data/caddy:/data
      - ${FB_HOME:-/opt/fluidbuddha}/data/caddy-config:/config
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 4s
      retries: 5
    logging: *logging

  # API, voice agent and background jobs. Runs the database migrations on start.
  backend:
    image: ${REGISTRY:?}/fluidbuddha/backend:${FB_VERSION:?}
    restart: unless-stopped
    # Voice sessions get this long to finish their answer before a stop or deploy (DRAIN_SECONDS).
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ${FB_HOME:-/opt/fluidbuddha}/backend.env
    volumes:
      - ${FB_HOME:-/opt/fluidbuddha}/secrets:/secrets:ro
    mem_limit: 3g
    logging: *logging

  console:
    image: ${REGISTRY:?}/fluidbuddha/console:${FB_VERSION:?}
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  website:
    image: ${REGISTRY:?}/fluidbuddha/website:${FB_VERSION:?}
    restart: unless-stopped
    mem_limit: 768m
    logging: *logging

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluidbuddha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: fluidbuddha
    volumes:
      - ${FB_HOME:-/opt/fluidbuddha}/data/postgres:/var/lib/postgresql/data
      # WAL archive (point-in-time recovery). vm/bin/backup.sh uploads it every 15 minutes.
      - ${FB_HOME:-/opt/fluidbuddha}/backups/wal:/wal
      # Filled only during a point-in-time recovery (vm/bin/restore.sh).
      - ${FB_HOME:-/opt/fluidbuddha}/backups/restore-wal:/restore-wal:ro
    shm_size: 256m
    # Sized for a 2 GB share of the VM. WAL is gzipped into /wal at least every 15 minutes.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - wal_level=replica
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=1GB
      - -c
      - archive_mode=on
      - -c
      - archive_command=gzip -c %p > /wal/%f.gz.part && mv -f /wal/%f.gz.part /wal/%f.gz
      - -c
      - archive_timeout=900
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluidbuddha -d fluidbuddha"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # Chat sessions and rate limits, shared by the backend's two worker processes. Not persisted.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "volatile-lru"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # TURN relay for voice handoff. Host networking: Azure puts the VM behind 1:1 NAT, so coturn needs
  # the private address to listen on and the public one to hand out (turnserver.conf).
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ${FB_HOME:-/opt/fluidbuddha}/turnserver.conf:/etc/coturn/turnserver.conf:ro
    mem_limit: 256m
    logging: *logging
