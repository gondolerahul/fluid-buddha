# Full A2UI backend stack — one command:
#   docker compose up -d --build
# Brings up Postgres+pgvector, then the orchestrator (which auto-creates the
# schema and seeds CORTEX memory from the mounted website docs on first boot).
# Postgres is exposed on host :5434 to avoid clashing with a local 5432/5433.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: a2ui-cortex-db
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5434:5432"
    volumes:
      - cortex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared state for more than one backend replica (F-3). Off by default.
  redis:
    image: redis:7-alpine
    container_name: a2ui-redis
    profiles: ["scale"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Relay for voice handoff calls (M2-2). Off by default: `--profile voice`.
  # Shares TURN_SECRET with the backend (set it: without one no credential is
  # ever valid). Time-limited credentials, no user
  # accounts on the relay). In production run it on a host with a public IP,
  # open 3478 (UDP+TCP) and the relay range, and set --external-ip if behind NAT;
  # point TURN_URLS at it, e.g. turn:turn.example.com:3478?transport=udp.
  coturn:
    image: coturn/coturn:4.6
    container_name: a2ui-coturn
    profiles: ["voice"]
    command:
      - "-n"
      - "--log-file=stdout"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:-}"
      - "--realm=${TURN_REALM:-fluidbuddha}"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--fingerprint"
      - "--no-cli"
      - "--no-multicast-peers"
      # Never relay into private networks (stops the relay being used to reach
      # internal services).
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

  backend:
    build: .
    container_name: a2ui-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Internal DB host (compose network), overrides any .env value.
      CORTEX_DB_URL: postgresql+asyncpg://cortex:cortex@postgres:5432/cortex
      # Defaults below read from backend/.env if present (compose interpolation).
      MOCK_AI: ${MOCK_AI:-true}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      FAST_MODEL: ${FAST_MODEL:-gemini-2.5-flash}
      HEAVY_MODEL: ${HEAVY_MODEL:-gemini-2.5-pro}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-004}
      TTS_MODEL: ${TTS_MODEL:-gemini-3.1-flash-tts-preview}
      TTS_GEMINI_VOICE: ${TTS_GEMINI_VOICE:-Aoede}
      # Public widget origins ("*" is fine: each request is also checked against
      # the website's domain) vs. the admin API, which only the console calls.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Production plumbing (F-3). REDIS_URL shares chat sessions and the rate
      # limit between replicas: start the redis service with
      #   REDIS_URL=redis://redis:6379/0 docker compose --profile scale up -d
      REDIS_URL: ${REDIS_URL:-}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ADMIN_CORS_ORIGINS: ${ADMIN_CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      # Seed the knowledge base from the mounted website docs on first boot.
      INGEST_ON_START: "true"
      INGEST_SITE: hirebuddha
      HIREBUDDHA_CONTENT_DIR: /content
      # buddha-cognitive-lab docs (mounted below). Ingest manually after boot:
      #   docker exec a2ui-backend python -m ingestion.ingest --site buddha-cognitive-lab
      BUDDHA_COGNITIVE_LAB_CONTENT_DIR: /content-bcl
      # fluidbuddha — the Extreme "container app". Its copy ships in this repo
      # (docs/website-copies). Ingest manually after boot:
      #   docker exec a2ui-backend python -m ingestion.ingest --site fluidbuddha
      FLUIDBUDDHA_CONTENT_DIR: /fluidbuddha/docs
      # Optional design system + OpenAPI for the Extreme tier (missing = defaults
      # / simulated APIs). Mount a folder at /fluidbuddha/assets to provide them.
      FLUIDBUDDHA_DESIGN_SYSTEM: /fluidbuddha/assets/design/design-system.json
      FLUIDBUDDHA_OPENAPI: /fluidbuddha/assets/apis/openapi.json
      # Optional live API for call_site_api (omit to simulate enquiries/data):
      # FLUIDBUDDHA_API_BASE_URL: https://api.fluidbuddha.example
      # FLUIDBUDDHA_API_AUTH: "Bearer ..."
    ports:
      - "8080:8080"
    volumes:
      # Content folders, read-only, for ingestion. Defaults assume the sibling
      # website repos sit next to this one (<workspace>/hire-buddha-website);
      # override any path via backend/.env (docs/defects.md D-14).
      # HireBuddha's page copy + product docs (website-copies/, product-docs/).
      - ${HIREBUDDHA_DOCS:-../../hire-buddha-website/docs/phase1}:/content:ro
      # Buddha Cognitive Lab's page copy (website-copies/).
      - ${BCL_DOCS:-../../buddha-cognitive-lab-website/docs}:/content-bcl:ro
      # fluidbuddha's own copy, from this repo (docs/website-copies/).
      - ${FLUIDBUDDHA_DOCS:-../docs}:/fluidbuddha/docs:ro
      # - /path/to/fluidbuddha-assets:/fluidbuddha/assets:ro   # design/ + apis/
      # For Vertex (MOCK_AI=false): mount ADC and set the env var below.
      # - ~/.config/gcloud:/root/.config/gcloud:ro
    # environment GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    restart: unless-stopped

volumes:
  cortex_pgdata:
