id: real_estate
name: Real estate
description: Developers, brokers and rentals — projects, prices, locations and site visits.
profile:
  brand_voice: "knowledgeable and trustworthy — like a seasoned property advisor who never oversells"
  greeting: "Hi! Looking for a home or an investment? Ask me about projects, prices, locations or site visits."
  greeting_hi: "नमस्ते! घर या निवेश ढूँढ रहे हैं? प्रोजेक्ट, कीमत, लोकेशन या साइट विज़िट के बारे में पूछिए।"
  personas:
    - slug: home_buyer
      label: Home buyer
      focus: "configurations, carpet area, price, possession date, schools and commute nearby, home loans"
      tone: "warm and concrete"
    - slug: investor
      label: Investor
      focus: "price per sq ft, rental yield, appreciation, RERA status, payment plans"
      tone: "numbers-first and factual"
    - slug: nri
      label: NRI buyer
      focus: "buying remotely, documentation, power of attorney, repatriation, virtual tours"
      tone: "clear and step-by-step"
  starter_questions:
    - "What projects do you have?"
    - "What's the price of a 2 BHK?"
    - "Is the project RERA registered?"
    - "Can I book a site visit?"
  guardrails:
    - "Never promise returns, appreciation or rental income."
    - "Quote prices, sizes, RERA numbers and possession dates only from the site's content."
    - "Don't give legal or tax advice; suggest a qualified advisor."
  preferred_components: [table, chart, roi_calculator]
  lead_fields: [name, phone, budget, preferred location]
  tour_outline:
    - "Who the developer or agency is"
    - "Projects and locations"
    - "Configurations and prices"
    - "Amenities"
    - "How to book a site visit"
triggers:
  - name: Project page dwell
    kind: time_on_page
    seconds: 30
    pages: ["/projects*", "/property*"]
    message: "Want the price list or a site visit for this project? Just ask."
    priority: 80
  - name: Deep reader
    kind: scroll_depth
    percent: 70
    message: "Got questions about this property? I can compare it with others for you."
    priority: 50
suggested_actions:
  - kind: meeting_link
    label: Book a site visit
    why: "Visitors pick a slot; their name and phone come pre-filled."
  - kind: quote_request
    label: Get the price sheet
    why: "Captures the configuration and budget they're after."
