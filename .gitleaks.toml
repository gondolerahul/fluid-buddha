# Secret scanning (M2-11): gitleaks' default rules, run over the full history
# in CI (.github/workflows/ci.yml, job "secrets").
[extend]
useDefault = true

[allowlist]
description = "Values that look like keys but aren't secrets"
regexes = [
  # Widget keys are public by design: they ship in every customer page's source.
  '''fbk_[A-Za-z0-9_-]+''',
  # Model settings in the technical spec ("400 tokens, `thinking_budget=0`")
  # trip the generic-api-key rule.
  '''thinking_budget=\d+''',
  # An Azure built-in role ID (Key Vault Secrets Officer), a public constant in the Bicep under
  # deploy/azure: the word "Secrets" in the role's name trips the generic-api-key rule.
  '''b86a8fe4-44ce-4948-aee5-eccb2c155cd7''',
]
paths = [
  # A product-film example brief that ships with the keynote skill: its mock UI shows a made-up
  # Stripe-style key next to its masked form.
  '''^\.claude/skills/keynote-product-film/examples/prismor/brief\.json$''',
]
